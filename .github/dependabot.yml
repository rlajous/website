# Dependency updates for the npm lockfile.
# cooldown: new releases are proposed only after they've been public for a while.
# Most compromised npm publishes (Shai-Hulud, ChainDrop, ...) were detected and pulled
# within days, so waiting keeps them out of the lockfile. Security updates skip the
# cooldown, so advisories are still patched right away.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors that break this repo (checked 2026-10-28): Tailwind 4 needs a config migration, typescript-eslint doesn't
    # support TS 7 yet, and eslint-plugin-jsdoc 50 doesn't support ESLint 10.
    # Security updates still come through; these get migrated by hand.
    ignore:
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
